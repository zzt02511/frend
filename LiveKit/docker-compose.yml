services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_BASE: ${RUNTIME_BASE:-node:22-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/live-sessions').then(r => process.exit(r.ok?0:1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://live.fuguilong.cn}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/wechat_private_live}
      DATABASE_STORAGE: ${DATABASE_STORAGE:-true}
      ROOM_PASSWORD_ENCRYPTION_KEY: ${ROOM_PASSWORD_ENCRYPTION_KEY}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://live.fuguilong.cn}
      WECHAT_OAUTH_APP_ID: ${WECHAT_OAUTH_APP_ID:-}
      WECHAT_OAUTH_APP_SECRET: ${WECHAT_OAUTH_APP_SECRET:-}
      LIVEKIT_EGRESS_URL: ${LIVEKIT_EGRESS_URL:-http://livekit:7880}
      TENCENT_RTMP_PUSH_URL: ${TENCENT_RTMP_PUSH_URL:-}
      REPLAY_DIRECTORY: /app/replays
    volumes:
      - app-data:/app/.data
      - replay-data:/app/replays
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      redis:
        condition: service_started

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}
        redis:
          address: redis:6379
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - replay-data:/output
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wechat_private_live}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wechat_private_live}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  replay-data:
  postgres-data:

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>非标定制家居内容生产流水线</title>
  <style>
    :root {
      --ink: #20211d;
      --muted: #62645d;
      --paper: #f5f1e8;
      --panel: #fffdf8;
      --line: #d8ccba;
      --wood: #8a5d35;
      --leaf: #50684d;
      --blue: #2f6173;
      --clay: #a04f3d;
      --gold: #c4a15f;
      --shadow: 0 18px 42px rgba(32, 33, 29, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(32,33,29,.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(32,33,29,.035) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .app { min-height: 100vh; display: grid; grid-template-columns: 410px minmax(0, 1fr); }
    aside { height: 100vh; overflow: auto; position: sticky; top: 0; padding: 22px; color: #fffaf0; background: #24251f; }
    main { padding: 22px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.2; }
    h2 { margin: 0; font-size: 28px; }
    h3 { margin: 0; font-size: 17px; }
    .sub { margin: 6px 0 18px; color: rgba(255,250,240,.7); font-size: 13px; line-height: 1.6; }
    .section-title { margin: 22px 0 10px; color: rgba(255,250,240,.78); font-size: 12px; font-weight: 900; }
    label { display: block; margin: 9px 0 5px; font-size: 12px; font-weight: 800; }
    input, textarea, select {
      width: 100%;
      min-height: 39px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 6px;
      padding: 9px 10px;
      color: #fffdf8;
      background: rgba(255,255,255,.075);
      outline: none;
      font: inherit;
      font-size: 13px;
    }
    textarea { min-height: 78px; resize: vertical; line-height: 1.55; }
    input:focus, textarea:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(196,161,95,.16); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 13px;
      color: #fffdf8;
      background: var(--clay);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
    }
    button.secondary { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }
    button.ghost { color: var(--ink); background: #f4ead8; border: 1px solid var(--line); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 16px; }
    .topbar p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .status-box, .project-strip, .metric, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(32,33,29,.07);
    }
    .status-box { padding: 12px; margin-bottom: 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .metric { padding: 14px; }
    .metric b { display: block; font-size: 26px; }
    .metric span { color: var(--muted); font-size: 12px; }
    .project-strip { display: grid; grid-template-columns: minmax(180px, 1fr) 190px auto; gap: 10px; align-items: end; padding: 13px; margin-bottom: 14px; }
    .project-strip label { color: var(--muted); margin-top: 0; }
    .project-strip input, .project-strip select { color: var(--ink); background: #fffdf8; border-color: var(--line); }
    .output-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
    .card { overflow: hidden; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; padding: 13px 14px; background: linear-gradient(135deg, rgba(138,93,53,.15), rgba(80,104,77,.09)); border-bottom: 1px solid var(--line); }
    .card-body { padding: 14px; }
    .script { margin: 0 0 12px; font-size: 14px; line-height: 1.72; white-space: pre-wrap; }
    .label { margin: 12px 0 6px; color: var(--wood); font-size: 12px; font-weight: 900; }
    ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.65; }
    .meta, .panel { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 12px; line-height: 1.6; }
    .meta { color: var(--muted); background: rgba(47,97,115,.055); border: 1px dashed rgba(47,97,115,.3); }
    .panel { background: rgba(80,104,77,.08); border-left: 3px solid var(--leaf); }
    .card textarea { color: var(--ink); background: #fffdf8; border-color: rgba(160,79,61,.22); min-height: 150px; }
    .badge { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 999px; background: var(--leaf); color: #fffdf8; font-size: 12px; font-weight: 900; }
    .status { min-height: 18px; margin-top: 7px; color: var(--leaf); font-size: 12px; font-weight: 800; }
    .warn { color: var(--clay); font-weight: 900; }
    .empty { min-height: 380px; display: grid; place-items: center; padding: 28px; text-align: center; color: var(--muted); background: rgba(255,253,248,.58); border: 1px dashed var(--line); border-radius: 8px; }
    .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .template-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: rgba(255,253,248,.78); cursor: pointer; box-shadow: 0 8px 18px rgba(32,33,29,.06); }
    .template-card.active { border-color: var(--clay); box-shadow: 0 0 0 3px rgba(160,79,61,.12); }
    .template-card b { display: block; font-size: 14px; margin-bottom: 5px; }
    .template-card span { display: block; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .template-card small { display: inline-flex; margin-top: 8px; padding: 4px 7px; border-radius: 999px; background: rgba(80,104,77,.1); color: var(--leaf); font-weight: 900; }
    @media (max-width: 1040px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .project-strip { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>非标定制家居<br>内容生产流水线</h1>
      <p class="sub">本地生成文案和项目，云端/API 负责 TTS、数字人和后续视频合成。</p>
      <div class="row-actions">
        <a class="button secondary" href="custom_home_settings.html" style="min-height:38px;border-radius:6px;padding:9px 13px;color:#fffdf8;text-decoration:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);font-size:13px;font-weight:900;">打开设置页</a>
      </div>

      <div class="section-title">门店与案例</div>
      <div class="grid-2">
        <div><label for="city">城市</label><input id="city" value="苏州"></div>
        <div><label for="district">区域</label><input id="district" value="吴中"></div>
      </div>
      <label for="store_name">门店名称</label><input id="store_name" value="木作先生全屋定制">
      <label for="community">小区/楼盘</label><input id="community" value="湖畔花园">
      <div class="grid-2">
        <div><label for="room_type">户型</label><input id="room_type" value="三室两厅"></div>
        <div><label for="area">面积</label><input id="area" value="118"></div>
      </div>

      <div class="section-title">产品与卖点</div>
      <div class="grid-2">
        <div>
          <label for="cabinet_type">柜类</label>
          <select id="cabinet_type">
            <option>全屋定制</option><option>衣柜定制</option><option>橱柜定制</option><option>门墙柜一体</option><option>木作定制</option>
          </select>
        </div>
        <div><label for="style">风格</label><input id="style" value="奶油原木风"></div>
      </div>
      <div class="grid-2">
        <div><label for="board">板材</label><input id="board" value="ENF级板材"></div>
        <div><label for="hardware">五金</label><input id="hardware" value="品牌缓冲五金"></div>
      </div>
      <label for="edge_banding">封边/工艺</label><input id="edge_banding" value="PUR封边、现场复尺">
      <label for="pain_points">业主痛点</label><textarea id="pain_points">收纳不够、担心甲醛、报价看不懂、怕安装翻车</textarea>
      <label for="selling_points">门店卖点</label><textarea id="selling_points">本地真实案例、透明报价、工厂直连、安装售后可追踪</textarea>
      <label for="benchmark_copy">对标爆款文案</label><textarea id="benchmark_copy" placeholder="可粘贴同行爆款文案，AI 改写时参考结构。"></textarea>

      <div class="section-title">真实素材</div>
      <label for="materialFiles">上传实拍图片/视频</label><input id="materialFiles" type="file" accept="image/*,video/*" multiple>
      <div class="row-actions"><button class="secondary" id="uploadMaterialsBtn">上传到本地素材库</button></div>
      <div class="status" id="materialStatus"></div>
      <label for="refineFile">图片精修</label><input id="refineFile" type="file" accept="image/*">
      <div class="status">精修类型、裁切比例、增强强度在设置页统一配置。</div>
      <canvas id="refineCanvas" width="900" height="1200" style="width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:rgba(255,255,255,.06);"></canvas>
      <div class="row-actions">
        <button class="secondary" id="previewRefineBtn">预览精修</button>
        <button class="secondary" id="saveRefineBtn">保存精修图</button>
      </div>
      <div class="status" id="refineStatus"></div>
      <label for="material_notes">素材说明</label><textarea id="material_notes" placeholder="例如：客厅整墙柜实拍、PUR封边特写、安装现场短视频"></textarea>

      <div class="section-title">转化设置</div>
      <label for="budget">预算/报价表达</label><input id="budget" value="按户型和柜体展开面积核算">
      <label for="promotion">活动/引导</label><input id="promotion" value="到店领取户型收纳规划">
      <label for="address">门店地址</label><input id="address" value="苏州吴中门店">
      <label for="contact">联系方式</label><input id="contact" value="私信预约量尺">
      <label for="quantity">生成数量</label><select id="quantity"><option value="5">5条</option><option value="10" selected>10条</option><option value="15">15条</option></select>

      <div class="row-actions">
        <button id="generateBtn">生成内容包</button>
        <button class="secondary" id="copyAllBtn">复制全部</button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h2>案例内容工作台</h2>
          <p>先生成小红书图文和短视频脚本，再把选中的脚本提交到云主机生成语音或数字人口播。</p>
        </div>
      </div>

      <div class="status-box" id="serverBadge">正在检测本地服务...</div>

      <div class="status-box">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;">
          <strong>界面模板</strong>
          <span id="selectedTemplateLabel" style="color:var(--muted);font-size:12px;">未选择模板</span>
        </div>
        <div class="template-grid" id="templateGrid"></div>
        <div class="status" id="templateStatus"></div>
      </div>

      <div class="project-strip">
        <div><label for="projectName">项目名称</label><input id="projectName" value="湖畔花园118平案例"></div>
        <div><label for="projectList">已保存项目</label><select id="projectList"></select></div>
        <div class="row-actions">
          <button class="ghost" id="saveProjectBtn">保存项目</button>
          <button class="ghost" id="loadProjectBtn">加载</button>
          <button class="ghost" id="deleteProjectBtn">删除</button>
        </div>
        <div class="status" id="projectStatus"></div>
      </div>

      <div class="summary">
        <div class="metric"><b id="countMetric">0</b><span>脚本数量</span></div>
        <div class="metric"><b id="titleMetric">0</b><span>标题数量</span></div>
        <div class="metric"><b id="safeMetric">0</b><span>合规提醒</span></div>
        <div class="metric"><b id="keywordMetric">0</b><span>私信关键词</span></div>
      </div>

      <section id="output" class="output-grid">
        <div class="empty"><div><strong>填写左侧案例后生成内容包</strong><p>每条内容包含图文笔记、视频脚本、剪辑建议、TTS/数字人 API 提交按钮。</p></div></div>
      </section>
    </main>
  </div>

  <script>
    const inputIds = ["city", "district", "store_name", "community", "room_type", "area", "budget", "cabinet_type", "board", "hardware", "edge_banding", "style", "pain_points", "selling_points", "promotion", "address", "contact", "benchmark_copy", "material_notes", "quantity"];
    let backendAvailable = false;
    let selectedTemplateId = "";
    const el = id => document.getElementById(id);
    const value = (id, fallback = "") => (el(id).value || fallback).trim();
    const escapeHtml = text => String(text ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[ch]));

    const templates = [
      {
        id: "xhs_case_1",
        name: "小红书案例图文风格1",
        tag: "图文",
        desc: "真实案例复盘，适合完工图和户型图。",
        quantity: "5",
        pain: "收纳不够、动线不好、空间浪费、担心效果翻车",
        selling: "真实完工图、同小区案例、设计师讲解、透明报价",
        material: "完工实拍、多角度空间图、柜门打开细节、户型图",
        benchmark: "按小红书图文笔记结构输出：封面要有冲突点，正文先讲户型问题，再讲解决方案，最后引导评论小区名。"
      },
      {
        id: "xhs_case_2",
        name: "小红书案例图文风格2",
        tag: "图文",
        desc: "前后对比种草，适合施工前后对照素材。",
        quantity: "5",
        pain: "装修前空间乱、收纳没有规划、担心花钱没效果",
        selling: "前后对比明显、设计落地、收纳动线优化、同城可到店看样",
        material: "改造前照片、完工后照片、局部对比图、收纳打开图",
        benchmark: "输出前后对比种草风格：开头用改造前痛点，正文强调变化和细节，语气像真实业主分享但不虚构业主身份。"
      },
      {

      },
      {

      },
      {
        id: "craft_detail_1",
        name: "工艺细节展示风格1",
        tag: "视频",
        desc: "近景细节流，适合短视频展示。",
        quantity: "10",
        pain: "担心不好用、担心安装翻车、担心细节粗糙、担心售后没人管",

        benchmark: "输出工艺展示风格：多用镜头语言和字幕点，口播短句，适合 15-30 秒视频。"
      },
      {
        id: "craft_detail_2",
        name: "工艺细节展示风格2",
        tag: "视频",
        desc: "工厂流程流，适合展示加工实力。",
        quantity: "10",

    function collectCase() {

        if (t) data.benchmark_copy = `${data.benchmark_copy}\n\n当前界面模板：${t.name}。模板要求：${t.benchmark}`.trim();

    async function aiRewrite(row, idx, button) {
      const settings = JSON.parse(localStorage.getItem("custom-home-ai-settings") || "{}");
      if (!settings.apiKey) { el(`row-status-${idx}`).textContent = "请先到设置页填写并保存 AI API Key。"; return; }
      const old = button.textContent; button.textContent = "改写中..."; button.disabled = true;
      try {
        const res = await fetch(settings.endpoint || "https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${settings.apiKey}` },
          body: JSON.stringify({ model: settings.model || "gpt-4o-mini", temperature: Number(settings.temperature || 0.7), messages: [{ role: "system", content: "你是非标定制家居短视频编导，只输出适合口播的改写稿。" }, { role: "user", content: `${row.llm_prompt}\n\n请只返回改写后的 script 文本。` }] })
        });
        const data = await res.json();
        el(`rewrite-${idx}`).value = data.choices?.[0]?.message?.content || data.output_text || "";
        row.rewritten_script = el(`rewrite-${idx}`).value;
        el(`row-status-${idx}`).textContent = "AI 改写完成，可继续编辑或提交云端。";
      } catch (error) {
        el(`row-status-${idx}`).textContent = `AI 改写失败：${error.message}`;
      } finally {
        button.textContent = old; button.disabled = false;
      }
    }

    function ratioSize(ratio) {
      const [w, h] = ratio.split(":").map(Number);
      const max = 1200;
      if (h >= w) return { width: Math.round(max * w / h), height: max };
      return { width: max, height: Math.round(max * h / w) };
    }

    function refinePreset(type, strength) {
      const s = strength / 100;
      if (type === "portrait") return { brightness: 1.04 + s * 0.12, contrast: 1.02 + s * 0.12, saturation: 1.02 + s * 0.08, warm: 5 + s * 8 };
      if (type === "environment") return { brightness: 1.02 + s * 0.1, contrast: 1.06 + s * 0.18, saturation: 1.03 + s * 0.14, warm: 2 + s * 5 };
      return { brightness: 1.03 + s * 0.11, contrast: 1.08 + s * 0.2, saturation: 1.06 + s * 0.16, warm: 1 + s * 4 };
    }

    function refineDefaults() {
      return JSON.parse(localStorage.getItem("custom-home-refine-defaults") || "{}");
    }

    function refineSetting(key, fallback) {
      const defaults = refineDefaults();
      return defaults[key] || fallback;
    }

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = reject;
        img.src = url;
      });
    }

    function sharpenCanvas(ctx, width, height, amount) {
      if (amount <= 0) return;
      const src = ctx.getImageData(0, 0, width, height);
      const dst = ctx.createImageData(width, height);
      const s = src.data;
      const d = dst.data;
      const a = amount / 100;
      const kernel = [0, -a, 0, -a, 1 + 4 * a, -a, 0, -a, 0];
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const i = (y * width + x) * 4;
          for (let c = 0; c < 3; c++) {
            let value = 0;
            let k = 0;
            for (let ky = -1; ky <= 1; ky++) {
              for (let kx = -1; kx <= 1; kx++) {
                value += s[((y + ky) * width + (x + kx)) * 4 + c] * kernel[k++];
              }
            }
            d[i + c] = Math.max(0, Math.min(255, value));
          }
          d[i + 3] = s[i + 3];
        }
      }
      ctx.putImageData(dst, 0, 0);
    }

    async function renderRefinedImage() {
      const file = el("refineFile").files?.[0];
      if (!file) { el("refineStatus").textContent = "请先选择一张产品、人员或环境图片。"; return null; }
      const img = await loadImageFromFile(file);
      const canvas = el("refineCanvas");
      const ratio = refineSetting("ratio", "3:4");
      const type = refineSetting("type", "product");
      const strength = Number(refineSetting("strength", "55"));
      const zoomSetting = Number(refineSetting("zoom", "8"));
      const size = ratioSize(ratio);
      canvas.width = size.width;
      canvas.height = size.height;
      const ctx = canvas.getContext("2d");
      const zoom = 1 + zoomSetting / 100;
      const targetRatio = size.width / size.height;
      const sourceRatio = img.width / img.height;
      let sw = img.width;
      let sh = img.height;
      if (sourceRatio > targetRatio) sw = img.height * targetRatio;
      else sh = img.width / targetRatio;
      sw = sw / zoom;
      sh = sh / zoom;
      const sx = (img.width - sw) / 2;
      const sy = (img.height - sh) / 2;
      const preset = refinePreset(type, strength);
      ctx.clearRect(0, 0, size.width, size.height);
      ctx.filter = `brightness(${preset.brightness}) contrast(${preset.contrast}) saturate(${preset.saturation})`;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size.width, size.height);
      ctx.filter = "none";
      const image = ctx.getImageData(0, 0, size.width, size.height);
      const data = image.data;
      for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.min(255, data[i] + preset.warm);
        data[i + 2] = Math.max(0, data[i + 2] - preset.warm / 2);
      }
      ctx.putImageData(image, 0, 0);
      sharpenCanvas(ctx, size.width, size.height, 12 + strength * 0.12);
      const label = { product: "产品精修", portrait: "人员精修", environment: "环境精修" }[type];
      el("refineStatus").textContent = `${label}预览已生成：${size.width}x${size.height}`;
      return canvas.toDataURL("image/png", 0.92);
    }

      if (!dataUrl) return;
      const project = value("projectName") || value("community", "同城案例");

      const stem = (file?.name || "material").replace(/\.[^.]+$/, "");

      const note = `精修图：${result.file.name}`;

      el("refineStatus").textContent = `已保存精修图：${result.file.url}`;
    }

    el("saveRefineBtn").addEventListener("click", saveRefinedImage);

    renderTemplates();
    detectServer().then(refreshProjects).then(generate);
  </script>
</body>

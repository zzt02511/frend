# 模板 YAML Schema 参考
# 每个模板文件必须包含一个 template: 根键

template:
  # 基本元数据 (必需)
  id: string                    # 唯一标识符, 如 "knowledge-short"
  name: string                  # 显示名称, 如 "知识科普短视频"
  version: string               # 语义化版本, 如 "1.0.0"
  description: string           # 描述文本
  category: string              # 分类: knowledge | product | story | tutorial | social
  thumbnail: string             # 缩略图路径 (可选)

  # 视频属性 (可选, 有默认值)
  video:
    width: 1920                 # 分辨率宽
    height: 1080                # 分辨率高
    fps: 30                     # 帧率
    default_duration: 15        # 默认时长(秒)
    max_duration: 60            # 最大时长(秒)

  # 参数化变量 (用户在 UI 中填写)
  parameters:
    - name: topic               # 变量名, 在模板中用 {{topic}} 引用
      label: 视频主题           # UI 显示标签
      type: text                # text | textarea | image | color | number | select
      required: true
      default: ""
      placeholder: "输入视频主题..."
      max_length: 200
      hint: "简短描述视频的核心内容"

  # 场景列表 (至少1个)
  scenes:
    - id: scene_1               # 场景唯一 ID
      duration: 5                # 时长(秒)
      transition: fade_in        # fade_in | slide_left | zoom_in | none
      elements:                  # 场景元素
        - type: background       # 背景
          fill: "#1a1a2e"
        - type: text             # 文本
          content: "{{topic}}"
          font_size: 72
          color: "#ffffff"
          align: center
          x: center
          y: center
          animation: scale_in    # scale_in | slide_up | typewriter | none
        - type: image            # 图像
          source: auto
          width: 400
          height: 400

  # 音频配置 (可选)
  audio:
    bgm_default: "bgm/default.mp3"  # 默认背景音乐路径
    bgm_volume: 0.3
    narration_voice: "zh-CN-XiaoxiaoNeural"
    narration_speed: 1.0
    narration_volume: 1.0

  # 字幕配置 (可选)
  subtitles:
    enabled: true
    font_size: 28
    color: "#ffffff"
    position: bottom            # top | bottom | overlay
    language: zh-CN

[project]
name = "frend-backend"
version = "0.1.0"
description = "DEERFLOW 驱动的模板化短视频工厂后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.122",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.28",
    "aiofiles>=24.1",
    "sse-starlette>=2.0",
    "pillow>=10.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
